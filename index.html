<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise for Dii ❤️</title>
    <!-- Add styles in Step 2 here -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <!-- Optional: Cover Layer -->
        <div id="welcome-layer" class="layer active-layer">
            <h1 class="welcome-text">Special Message Inside...</h1>
            <button class="action-btn" id="open-btn">Click to Open, Dii!</button>
        </div>

        <!-- Hidden Main Content Layers -->
        <div id="main-content-layers" class="hidden">
            
            <!-- Layer 1: Teddy Bear Screen -->
            <div id="teddy-layer" class="layer">
                <div class="teddy-container">
                    <div class="teddy">
                        <div class="ear left"></div>
                        <div class="ear right"></div>
                        <div class="face">
                            <div class="eye left"></div>
                            <div class="eye right"></div>
                            <div class="mouth"></div>
                        </div>
                        <div class="body">
                            <div class="heart">❤️</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Layer 2: Automated Message Sequence -->
            <div id="message-layer" class="layer">
                <div class="text-container">
                    <h1 class="typed-text" id="auto-message"></h1>
                </div>
            </div>

        </div> <!-- End of content layers -->
    </div>

    <!-- Add script in Step 3 here -->
    <script src="script.js"></script>
</body>
</html>
